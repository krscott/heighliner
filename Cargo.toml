[package]
name = "heighliner"
version = "0.1.0"
edition = "2024"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
axum = "0.8.9"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "macros"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[package]
name = "heighliner"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.9", features = ["derive"] }
evdev = "0.13.2"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["service", "tokio"] }
maud = { version = "0.27.0", default-features = false }
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "macros", "io-util", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
zbus = { version = "6.5.0", default-features = false, features = ["proxy", "service", "tokio"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", features = ["util"] }
